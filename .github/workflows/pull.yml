name: Pull Yahoo Finance data

on:
  schedule:
    # GitHub sometimes delays or drops scheduled runs, so each pull has a backup slot.
    # Pre-market ~07:45 and backup ~08:10 New York time (two lines each cover US daylight saving)
    - cron: "45 11 * * 1-5"   # 07:45 EDT (summer)
    - cron: "45 12 * * 1-5"   # 07:45 EST (winter) = 20:45 SGT
    - cron: "10 12 * * 1-5"   # 08:10 EDT backup
    - cron: "10 13 * * 1-5"   # 08:10 EST backup = 21:10 SGT
    # After-close ~16:20 and backup ~16:55 New York time, for earnings-after-the-close alerts
    - cron: "20 20 * * 1-5"   # 16:20 EDT
    - cron: "20 21 * * 1-5"   # 16:20 EST = 05:20 SGT
    - cron: "55 20 * * 1-5"   # 16:55 EDT backup
    - cron: "55 21 * * 1-5"   # 16:55 EST backup = 05:55 SGT
  push:
    branches: [main]
    paths: ["pull.py", "tickers.txt", "benchmarks.txt", "universe.txt", "fomc.txt", "requirements.txt", ".github/workflows/pull.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pull.py
      - name: Commit data
        run: |
          git config user.name "stock-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update market data $(date -u +'%F %H:%M')"
          git pull --rebase origin main
          git push
